name: Build Hotfix DLL
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter 'CMS21-Together-Hotfix.csproj' | Select-Object -First 1
          if (-not $proj) { Write-Error 'csproj not found'; exit 1 }
          Write-Host "Building $($proj.FullName)"
          dotnet build $proj.FullName -c Release -o out
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: CMS21-Together-Hotfix
          path: out/CMS21-Together-Hotfix.dll
