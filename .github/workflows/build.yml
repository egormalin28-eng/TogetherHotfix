name: Build Hotfix DLL
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build "CMS21-Together-Hotfix.csproj" -c Release -o out
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: CMS21-Together-Hotfix
          path: out/CMS21-Together-Hotfix.dll
